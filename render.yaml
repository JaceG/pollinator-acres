services:
  - type: web
    name: pollinator-acres
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_LIST_ID
        sync: false
      - key: SIGNUP_NOTIFY_EMAIL
        sync: false
      - key: SIGNUP_NOTIFY_FROM
        sync: false

  - type: cron
    name: instagram-token-refresh
    runtime: node
    plan: starter
    schedule: "0 6 1 * *"
    buildCommand: npm ci
    startCommand: npm run refresh-instagram-token
    envVars:
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_CRON_SERVICE_ID
        sync: false
