name: Supabase keep-alive

# Supabase pauses free projects after ~7 days of inactivity, which breaks the
# website signup form. This pings the site's health endpoint, which runs a
# real database query, so the project never looks idle. Runs twice a day.
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 60 --retry 3 --retry-delay 20 https://pollinatoracres.com/api/health)
          echo "$body"
          echo "$body" | grep -q '"supabase":"ok"' || { echo "Supabase health check failed"; exit 1; }
